<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EX MACHINA // Loot Priority Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C0F;
    --panel:#12161B;
    --panel-2:#161B21;
    --line:#232A32;
    --amber:#FFB627;
    --amber-dim:#8A6A1F;
    --cyan:#4FD1C5;
    --text:#E4E7EB;
    --muted:#6B7480;
    --danger:#E5484D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 50% -10%, rgba(79,209,197,0.06), transparent),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1280px; margin:0 auto;}

  /* header */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:16px;
    border-bottom:1px solid var(--line);
    padding-bottom:20px; margin-bottom:6px;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.25em;
    color:var(--cyan); text-transform:uppercase; margin-bottom:8px;
    display:flex; align-items:center; gap:8px;
  }
  .brand-eyebrow::before{
    content:''; width:6px; height:6px; background:var(--cyan); display:inline-block;
    box-shadow:0 0 8px var(--cyan); animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  h1{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:clamp(28px,4vw,44px);
    letter-spacing:0.02em; text-transform:uppercase; line-height:1;
  }
  h1 span{color:var(--amber);}
  .meta{
    font-size:11px; color:var(--muted); text-align:right; line-height:1.7;
    letter-spacing:0.04em; text-transform:uppercase;
  }
  .meta b{color:var(--text); font-weight:600;}

  /* legend / access strip */
  .access-strip{
    display:flex; gap:24px; flex-wrap:wrap; align-items:center;
    font-size:11px; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase;
    padding:14px 0 26px; border-bottom:1px solid var(--line); margin-bottom:24px;
  }
  .access-strip .tag{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); padding:4px 10px; border-radius:2px;
    color:var(--muted);
  }
  .access-strip .tag.view{color:var(--cyan); border-color:rgba(79,209,197,0.35);}
  .access-strip .tag.lock{color:var(--amber); border-color:rgba(255,182,39,0.35);}

  /* search / filter */
  .toolbar{
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .toolbar input{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-family:'IBM Plex Mono'; font-size:12.5px; padding:9px 12px;
    letter-spacing:0.02em; min-width:220px; border-radius:2px;
  }
  .toolbar input:focus{ outline:none; border-color:var(--cyan); }
  .toolbar input::placeholder{ color:var(--muted); }
  .toolbar .hint{ font-size:10.5px; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase; }

  /* table panel */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .panel::before, .panel::after{
    content:''; position:absolute; width:14px; height:14px;
    border-color:var(--amber); border-style:solid; opacity:0.6;
  }
  .panel::before{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .panel::after{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  .table-scroll{ overflow-x:auto; max-height:74vh; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:1180px; }
  thead th{
    position:sticky; top:0; background:var(--panel-2);
    text-align:left; font-family:'IBM Plex Mono'; font-weight:600;
    font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);
    padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
    cursor:pointer; user-select:none; z-index:2;
  }
  thead th:hover{ color:var(--cyan); }
  thead th.sorted{ color:var(--amber); }
  thead th .arrow{ font-size:9px; margin-left:4px; opacity:0.7; }
  tbody td{
    padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
    color:var(--text);
  }
  tbody tr{ transition:background 0.12s ease; }
  tbody tr:hover{ background:rgba(79,209,197,0.045); }
  tbody tr:nth-child(even){ background:rgba(255,255,255,0.012); }

  .char-name{ font-family:'Rajdhani', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.01em; }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .pct{ color:var(--cyan); }
  .score{ color:var(--muted); }

  .rank-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:26px; height:22px; padding:0 6px;
    border:1px solid var(--amber-dim); color:var(--amber);
    font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums;
  }
  .rank-badge.top{ border-color:var(--amber); background:rgba(255,182,39,0.1); box-shadow:0 0 10px rgba(255,182,39,0.15); }

  .item-pip{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--line);
  }
  .item-pip.on{ background:var(--cyan); box-shadow:0 0 6px rgba(79,209,197,0.6); }

  .penalty{ color:var(--danger); }
  .penalty.zero{ color:var(--muted); }

  footer{
    margin-top:22px; padding-top:18px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
    font-size:10.5px; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase;
  }

  @media (max-width:640px){
    .meta{ text-align:left; }
    header{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand-eyebrow">Guild Ops · Ex Machina</div>
      <h1>Loot Priority <span>Roster</span></h1>
    </div>
    <div class="meta">
      <div><b id="pilot-count">0</b> pilots tracked</div>
      <div>Sorted by priority — lower number rolls first</div>
    </div>
  </header>

  <div class="access-strip">
    <span class="tag view">● View-only for guild</span>
    <span class="tag lock">🔒 Edited by loot officer only</span>
    <span class="tag">Internal score columns hidden by default</span>
  </div>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Search pilot name…">
    <span class="hint">Click any column header to sort</span>
  </div>

  <div class="panel">
    <div class="table-scroll">
      <table id="loot-table">
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <footer>
    <span>Ex Machina Loot Weighting · read-only export</span>
    <span id="gen-date"></span>
  </footer>

</div>

// column keys, short display headers, and render types
const COLS = [
  {key:0,  label:'Pilot',        type:'name'},
  {key:1,  label:'Weekly',       type:'int'},
  {key:2,  label:'Cumulative',   type:'int'},
  {key:3,  label:'Combat Pwr',   type:'int'},
  {key:4,  label:'Weekly Sc.',   type:'score'},
  {key:5,  label:'Cumul. Sc.',   type:'score'},
  {key:6,  label:'CP Sc.',       type:'score'},
  {key:7,  label:'Weighted Sc.', type:'score'},
  {key:8,  label:'Loot Wt %',    type:'pct'},
  {key:9,  label:'T1',           type:'pip'},
  {key:10, label:'T2',           type:'pip'},
  {key:11, label:'T3',           type:'pip'},
  {key:12, label:'T4',           type:'pip'},
  {key:13, label:'E.Active',     type:'pip'},
  {key:14, label:'Base Rank',    type:'int'},
  {key:15, label:'Penalty',      type:'penalty'},
  {key:16, label:'Priority #',   type:'rank'},
  {key:17, label:'Loot Order',   type:'int'},
];

let sortCol = 16, sortAsc = true;
let rows = DATA.rows.slice();
let query = '';

function visibleRows(){
  if(!query) return rows;
  const q = query.toLowerCase();
  return rows.filter(r => String(r[0]).toLowerCase().includes(q));
}

function render(){
  const thead = document.getElementById('table-head');
  thead.innerHTML = COLS.map(c => {
    const active = c.key === sortCol;
    const arrow = active ? (sortAsc ? '▲' : '▼') : '';
    const align = ['int','pct','pip','penalty','rank','score'].includes(c.type) ? 'text-align:right' : '';
    return `<th style="${align}" class="${active?'sorted':''}" data-col="${c.key}">${c.label}<span class="arrow">${arrow}</span></th>`;
  }).join('');

  const vRows = visibleRows();
  document.getElementById('pilot-count').textContent = vRows.length;

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = vRows.map(r => {
    return '<tr>' + COLS.map(c => {
      const v = r[c.key];
      switch(c.type){
        case 'name':
          return `<td><div class="char-name">${v ?? '—'}</div></td>`;
        case 'int':
          return `<td class="num">${v==null?'—':Number(v).toLocaleString()}</td>`;
        case 'pct':
          return `<td class="num pct">${v==null?'—':(Number(v)*100).toFixed(2)+'%'}</td>`;
        case 'score':
          return `<td class="num score">${v==null?'—':Number(v).toFixed(3)}</td>`;
        case 'pip':
          return `<td class="num"><span class="item-pip ${Number(v)>0?'on':''}"></span></td>`;
        case 'penalty':
          return `<td class="num ${Number(v)>0?'penalty':'penalty zero'}">${v==null?'—':v}</td>`;
        case 'rank':
          const n = Number(v);
          return `<td class="num"><span class="rank-badge ${n<=3?'top':''}">${v}</span></td>`;
        default:
          return `<td class="num">${v ?? '—'}</td>`;
      }
    }).join('') + '</tr>';
  }).join('');
}

document.getElementById('table-head').addEventListener('click', (e) => {
  const th = e.target.closest('th');
  if(!th) return;
  const col = Number(th.dataset.col);
  if(sortCol === col){ sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
  rows.sort((a,b) => {
    let av = a[col], bv = b[col];
    if(av == null) av = typeof bv === 'string' ? '' : -Infinity;
    if(bv == null) bv = typeof av === 'string' ? '' : -Infinity;
    if(typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });
  render();
});

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  render();
});

document.getElementById('gen-date').textContent = 'Generated ' + new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>
